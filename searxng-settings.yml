# SearXNG Settings for Local Prospect Finder
# Meta-search engine that aggregates Google, Bing, DuckDuckGo results.

use_default_settings: true

general:
  debug: false
  instance_name: "LPF Search"

server:
  secret_key: "lpf-searxng-secret-key-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false

  - name: bing
    engine: bing
    shortcut: b
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  - name: qwant
    engine: qwant
    shortcut: qw
    disabled: false

outgoing:
  request_timeout: 10.0
  useragent_suffix: ""
